name: Temporary Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-windows-rdp
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350
    steps:
      - name: Check required secrets
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw 'Set the TS_AUTHKEY repository secret.' }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD) -or $env:RDP_PASSWORD.Length -lt 16) { throw 'Set RDP_PASSWORD to a unique password of at least 16 characters.' }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Configure private RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          if ($ip -notmatch '^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.') { throw 'No Tailscale IPv4 address was found.' }

          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name 'rdpuser' -Password $password -PasswordNeverExpires -AccountNeverExpires -Description 'Temporary RDP user' | Out-Null
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdpuser'
          Add-LocalGroupMember -SID 'S-1-5-32-544' -Member 'rdpuser'
          $adminGroup = Get-LocalGroup -SID 'S-1-5-32-544'
          $adminMember = Get-LocalGroupMember -Group $adminGroup | Where-Object { $_.SID -eq (Get-LocalUser -Name 'rdpuser').SID }
          if (-not $adminMember) { throw 'RDP user was not added to the local Administrators group.' }

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Get-NetFirewallRule -Name 'RemoteDesktop*' -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP via Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -LocalAddress $ip -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null
          "Tailscale IP: $ip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Windows App user: .\rdpuser (local Administrator)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Use the password saved in the RDP_PASSWORD repository secret. Stop the run when finished.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "RDP is available at $ip using .\rdpuser. Password is not printed."

      - name: Keep runner available
        shell: pwsh
        run: |
          Write-Host 'The runner will remain available for about 5.5 hours. Cancel the workflow when finished.'
          Start-Sleep -Seconds 19800
